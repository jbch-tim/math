<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>은서의 프랑스어 놀이</title>
<meta name="apple-mobile-web-app-title" content="은서 프랑스어">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF6FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF6FF; --card:#FFFFFF; --ink:#33395A; --soft:#8590AE;
    --pink:#FF8FAB; --blue:#6EC6FF; --green:#7ED957; --yellow:#FFD166; --purple:#B79CFF; --orange:#FFB37A; --red:#FF7B7B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Jua',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
  header{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
  .flag{display:inline-flex;height:.8em;width:1.2em;border-radius:3px;overflow:hidden;vertical-align:-.05em;box-shadow:0 0 0 1px #0001}
  .flag i{flex:1}.flag i:nth-child(1){background:#2B59C3}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#E5484D}
  .stars{font-size:28px;background:#fff;border-radius:40px;padding:6px 18px;box-shadow:0 3px 0 #0001}
  .iconbtn{font-size:28px;background:#fff;border:none;border-radius:50%;width:56px;height:56px;box-shadow:0 3px 0 #0001;cursor:pointer;font-family:inherit}
  main{width:100%;max-width:900px;flex:1;display:flex;flex-direction:column;align-items:center;padding:0 16px 110px}
  h1{font-size:40px;margin:6px 0 4px;text-align:center}
  .sub{font-size:22px;color:var(--soft);margin:0 0 16px;text-align:center}
  button{font-family:inherit;color:var(--ink)}

  /* home: themes */
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
  .th{border:none;border-radius:26px;padding:14px 6px 12px;font-size:24px;cursor:pointer;box-shadow:0 6px 0 #0002;
      display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s;position:relative}
  .th:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
  .th .big{font-size:50px;line-height:1.1}
  .th .frn{font-size:16px;opacity:.75}
  .th .meter{width:80%;height:9px;background:#ffffff88;border-radius:6px;overflow:hidden;margin-top:4px}
  .th .meter i{display:block;height:100%;background:#fff}
  .th .crown{position:absolute;top:6px;right:10px;font-size:22px}
  .homerow{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin-top:18px}
  .homerow .big-btn{font-size:24px;line-height:1.3}
  .homerow small{font-size:18px;opacity:.85}
  .reviewbtn{width:100%;margin:4px 0 18px;background:var(--red);color:#fff}

  /* theme page */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:620px}
  .modes button{border:none;border-radius:26px;padding:20px 8px;font-size:26px;cursor:pointer;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;gap:6px}
  .modes button:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
  .modes .big{font-size:52px} .modes small{font-size:17px;opacity:.8}
  .wordlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px;max-width:700px}
  .chip{background:#fff;border:none;border-radius:16px;padding:8px 12px;font-size:20px;box-shadow:0 2px 0 #0001;cursor:pointer;display:flex;align-items:center;gap:6px}
  .chip .lv{font-size:13px;color:var(--soft)}
  .chip.m2{background:#E9F9DE}.chip.m4{background:#FFF3C4}

  /* card visuals */
  .pic{display:flex;align-items:center;justify-content:center;line-height:1}
  .dotc{display:inline-block;border-radius:50%;box-shadow:inset 0 -6px 0 #0002, 0 0 0 3px #0001}
  .numpic{font-size:1em;font-weight:bold;color:var(--purple)}

  /* learn */
  .card{background:#fff;border-radius:32px;box-shadow:0 6px 0 #0001;padding:22px 20px 18px;width:100%;max-width:560px;text-align:center;cursor:pointer}
  .card .pic{font-size:130px;height:150px}
  .card .fw{font-size:52px;margin-top:10px;color:#2B59C3;word-break:keep-all}
  .card .pr{font-size:30px;color:var(--pink);margin-top:4px}
  .card .ko{font-size:28px;color:var(--soft);margin-top:6px}
  .card.flip{animation:flip .35s}
  @keyframes flip{0%{transform:scale(.9) rotateY(25deg);opacity:.4}100%{transform:none;opacity:1}}
  .nav{display:flex;gap:16px;margin-top:18px;align-items:center}
  .nav button{font-size:38px;width:86px;height:86px;border-radius:50%;border:none;background:var(--yellow);box-shadow:0 5px 0 #0002;cursor:pointer}
  .nav button.alt{background:#fff}
  .nav button:active{transform:translateY(3px)}
  .count{font-size:22px;color:var(--soft);margin-top:10px}

  /* quiz */
  .progress{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap;justify-content:center}
  .dot{width:20px;height:20px;border-radius:50%;background:#DCE3F2}
  .dot.done{background:var(--yellow)} .dot.miss{background:#FFC9C9}
  .question{font-size:30px;margin:4px 0 12px;text-align:center;min-height:40px}
  .again-tag{font-size:18px;background:#FFE3E3;color:#C0392B;border-radius:12px;padding:4px 10px;margin-bottom:6px}
  .speak{display:flex;gap:14px;margin-bottom:18px}
  .speak button{border:none;border-radius:50%;width:120px;height:120px;font-size:60px;background:var(--blue);box-shadow:0 6px 0 #0002;cursor:pointer}
  .speak button.slow{width:84px;height:84px;font-size:40px;background:#fff;align-self:center}
  .speak button:active{transform:translateY(4px)}
  .speak button.ping{animation:ping .8s}
  @keyframes ping{30%{transform:scale(1.12)}}
  .target{background:#fff;border-radius:30px;box-shadow:0 5px 0 #0001;padding:14px 26px;text-align:center;margin-bottom:16px;min-width:220px}
  .target .pic{font-size:110px;height:120px}
  .target .ko{font-size:28px;color:var(--soft)}
  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:620px}
  .choices.c3{grid-template-columns:repeat(3,1fr)}
  .choice{border:none;border-radius:26px;background:#fff;box-shadow:0 6px 0 #0002;cursor:pointer;padding:12px 6px;min-height:120px;
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .1s}
  .choice:active{transform:translateY(4px)}
  .choice .pic{font-size:70px;height:80px}
  .choice .ko{font-size:19px;color:var(--soft)}
  .choice .fw{font-size:30px;color:#2B59C3;word-break:keep-all;line-height:1.15}
  .choice .pr{font-size:19px;color:var(--pink)}
  .choices.text .choice{min-height:96px}
  .choices.long{grid-template-columns:1fr} .choices.long .choice{min-height:76px} .choices.long .fw{font-size:26px}
  .choice.right{background:var(--green)} .choice.right .fw,.choice.right .pr,.choice.right .ko{color:#fff}
  .choice.wrong{opacity:.3;animation:shake .4s}
  .choice.hint{outline:5px dashed var(--green);outline-offset:-5px;animation:hop .7s infinite}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes hop{50%{transform:translateY(-6px)}}

  /* memory game */
  .mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:640px}
  .mc{aspect-ratio:3/4;border:none;border-radius:20px;cursor:pointer;position:relative;perspective:600px;background:none;padding:0}
  .mc .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
  .mc.open .in,.mc.done .in{transform:rotateY(180deg)}
  .mc .f,.mc .b{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 #0002;padding:4px}
  .mc .f{background:var(--purple);font-size:40px;color:#fff}
  .mc .b{background:#fff;transform:rotateY(180deg)}
  .mc.done .b{background:#E9F9DE}
  .mc .b .pic{font-size:56px;height:62px}
  .mc .b .fw{font-size:22px;color:#2B59C3;text-align:center;line-height:1.1;word-break:keep-all}
  .mc .b .pr{font-size:15px;color:var(--pink)}

  /* end, misc */
  .celebrate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:160px;animation:pop .9s ease forwards;z-index:7}
  @keyframes pop{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
  .end{text-align:center}
  .end .trophy{font-size:130px}
  .end .row{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .big-btn{font-size:28px;border:none;border-radius:26px;padding:16px 26px;cursor:pointer;box-shadow:0 5px 0 #0002}
  .big-btn:active{transform:translateY(3px)}
  .modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:16px;z-index:8}
  .modal.open{display:flex}
  .sheet{background:#fff;border-radius:26px;padding:24px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto}
  .sheet h2{margin:0 0 14px;font-size:30px}
  .opt{margin:14px 0}
  .opt label{display:block;font-size:21px;margin-bottom:6px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;font-size:20px;padding:10px 4px;border-radius:14px;border:2px solid #E3E8F3;background:#fff;cursor:pointer}
  .seg button.on{background:var(--purple);border-color:var(--purple);color:#fff}
  #vsel{flex:1;font-family:inherit;font-size:17px;padding:8px;border-radius:12px;border:2px solid #E3E8F3;background:#fff;color:var(--ink);min-width:0}
  .small{font-size:20px;border:none;border-radius:18px;padding:10px 16px;background:#fff;box-shadow:0 3px 0 #0001;cursor:pointer;white-space:nowrap}
  .note{font-family:system-ui,sans-serif;font-size:14px;color:var(--soft);line-height:1.5;margin-top:16px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
  .pad button{font-size:28px;padding:12px;border-radius:16px;border:none;background:#F1F4FA;cursor:pointer}
  .shake{animation:shake .4s}
  #buddy{position:fixed;right:12px;bottom:12px;z-index:4;display:flex;align-items:flex-end;gap:6px;cursor:pointer}
  #buddyFace{font-size:68px;line-height:1;filter:drop-shadow(0 4px 0 #0001)}
  #bubble{background:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;font-size:21px;box-shadow:0 3px 0 #0001;max-width:230px;opacity:0;transform:translateY(8px) scale(.9);transition:.25s;pointer-events:none}
  #bubble.show{opacity:1;transform:none}
  #buddy.jump #buddyFace{animation:jump .6s}
  #buddy.sad #buddyFace{animation:wob .6s}
  @keyframes jump{30%{transform:translateY(-30px) rotate(-8deg)}60%{transform:translateY(0) scale(1.1,.9)}}
  @keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
  .conf{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:6;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{top:105vh;transform:rotate(720deg) translateX(40px)}}
  .friends{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:600px}
  .fr{aspect-ratio:1;border:none;border-radius:20px;background:#fff;box-shadow:0 4px 0 #0001;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .fr .fe{font-size:44px}.fr .fn{font-size:14px;color:var(--soft)}
  .fr.me{outline:4px solid var(--yellow)} .fr.locked{opacity:.5}
  .cal-top{display:flex;align-items:center;gap:18px;font-size:28px;margin-bottom:12px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:560px}
  .cal-h{text-align:center;font-size:20px;color:var(--soft)}
  .cal-d{background:#fff;border-radius:14px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 0 #0001}
  .cal-d .n{font-size:14px;color:var(--soft);position:absolute;top:3px;left:7px}
  .cal-d .s{font-size:32px}
  .cal-d.got{background:#FFF3C4} .cal-d.today{outline:3px solid var(--purple)}
  /* report */
  .rp-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-bottom:6px}
  .rp-sum div{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 3px 0 #0001}
  .rp-sum b{display:block;font-size:32px} .rp-sum span{font-size:15px;color:var(--soft)}
  .rp-h{align-self:flex-start;font-size:25px;margin:22px 0 8px}
  .rp-row{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 #0001;width:100%;margin-bottom:8px}
  .rp-top{display:flex;justify-content:space-between;font-size:20px}
  .rp-bar{height:10px;background:#EEF1F7;border-radius:6px;margin-top:6px;overflow:hidden} .rp-bar i{display:block;height:100%;background:var(--green)}
  .rp-weak{display:flex;flex-wrap:wrap;gap:8px;width:100%}
  .rp-weak span{background:#FFE3E3;border-radius:14px;padding:8px 12px;font-size:20px} .rp-weak small{font-size:14px;color:var(--soft)}
  .rp-note{align-self:flex-start;font-family:system-ui,sans-serif;font-size:14px;color:var(--soft);line-height:1.5}

  /* levels, write, status */
  .lvtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-bottom:18px}
  .lvt{border:none;border-radius:18px;background:#fff;box-shadow:0 4px 0 #0001;padding:10px 4px;font-size:21px;cursor:pointer;display:flex;flex-direction:column;align-items:center;border-bottom:6px solid var(--lc)}
  .lvt small{font-size:14px;color:var(--soft)} .lvt.on{background:var(--lc)} .lvt.on small{color:var(--ink)} .lvt.locked{opacity:.55}
  .th.nextb{background:#fff;border:3px dashed #C9D2E6;box-shadow:none;cursor:default;color:var(--soft)} .th.nextb .meter{background:#EEF1F7} .th.nextb .meter i{background:var(--green)}
  .lockbox{background:#fff;border-radius:24px;padding:22px;text-align:center;font-size:22px;line-height:1.5;width:100%;box-shadow:0 4px 0 #0001}
  .modes .span2{grid-column:span 2}
  .stlegend{font-size:16px;color:var(--soft);margin:16px 0 0}
  .chip.st2{background:#FFF3C4} .chip.st3{background:#E9F9DE} .chip b{color:var(--purple)}
  .tpic{display:inline-block;font-size:.42em;background:#FFF3C4;color:var(--ink);border-radius:.3em;padding:.15em .35em;line-height:1.2;white-space:nowrap}
  .target.wt{padding:8px 22px;margin-bottom:8px} .target.wt .pic{font-size:80px;height:88px}
  .speak.sm{margin-bottom:10px} .speak.sm button{width:76px;height:76px;font-size:38px} .speak.sm button.slow{width:60px;height:60px;font-size:28px}
  .slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;margin:6px 0 16px;min-height:64px;max-width:720px}
  .slots .pre{font-size:34px;color:var(--soft);margin-right:6px;align-self:center}
  .slots .fix{font-size:34px;align-self:center} .slots .gap{width:18px}
  .slot{width:46px;height:58px;border:none;border-bottom:4px solid #B8C2DA;background:#fff;border-radius:12px 12px 4px 4px;font-size:32px;color:#2B59C3;cursor:pointer;box-shadow:0 2px 0 #0001}
  .slots.ws .slot{width:auto;min-width:90px;padding:0 10px;font-size:24px}
  .slot.good{background:#DDF6CF;border-color:var(--green)} .slot.bad{background:#FFE0E0;border-color:var(--red);animation:shake .4s}
  .tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
  .tile{min-width:56px;height:60px;padding:0 12px;border:none;border-radius:16px;background:var(--yellow);box-shadow:0 5px 0 #0002;font-size:30px;cursor:pointer}
  .tiles.ws .tile{font-size:22px;background:#CDE9FF}
  .tile:active{transform:translateY(3px)} .tile.used{visibility:hidden}
  .sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#EEF1F7;margin-top:8px} .sbar i{display:block;height:100%}
  .sbar .s3{background:#3DBE5B} .sbar .s2{background:#FFD166} .sbar .s1{background:#B7E4A0}
  .rp-meta{font-family:system-ui,sans-serif;font-size:13px;color:var(--soft);margin-top:4px}
  .rp-explain{background:#fff;border-radius:18px;padding:6px 16px;width:100%;font-family:system-ui,sans-serif;font-size:15px;line-height:1.6;box-shadow:0 3px 0 #0001}
  .rlv{align-self:flex-start;font-size:20px;color:var(--soft);margin:12px 0 2px}
  @media (max-width:560px){ .lvt{font-size:16px;padding:8px 2px} .lvt small{font-size:11px}
    .slot{width:34px;height:46px;font-size:24px} .slots .pre,.slots .fix{font-size:24px} .slots.ws .slot{min-width:64px;font-size:18px}
    .tile{min-width:44px;height:50px;font-size:24px;padding:0 8px} .tiles.ws .tile{font-size:17px} .tiles{gap:7px} .lockbox{font-size:18px} }
  /* skills */
  .skbtn{background:linear-gradient(90deg,#8E5BE8,#FF8FAB)}
  .cjtab{display:flex;flex-direction:column;gap:8px;width:100%;max-width:560px}
  .cjrow{border:none;background:#fff;border-radius:16px;box-shadow:0 3px 0 #0001;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left}
  .cjrow .cjp{font-size:16px;color:var(--soft);width:96px} .cjrow .fw{font-size:30px;flex:1} .cjrow .pr{font-size:18px;color:var(--pink)}
  .cjrow.now{background:#FFF3C4}
  .target.cjq{padding:16px 26px} .cjbig{font-size:46px;color:#2B59C3} .cjbig b{color:var(--ink)}
  .target.sq .fw{font-size:32px;color:#2B59C3;word-break:keep-all}
  .nav #mic{background:var(--green);font-size:44px} .nav #mic.listening{background:var(--red);animation:hop .8s infinite}
  @media (max-width:560px){ .cjrow .fw{font-size:22px} .cjrow .cjp{width:72px;font-size:13px} .cjbig{font-size:34px} .target.sq .fw{font-size:24px} }
  /* reading */
  .readbtn{width:100%;margin-top:14px;background:linear-gradient(90deg,#2B59C3,#6EC6FF);color:#fff;display:flex;justify-content:center;align-items:baseline;gap:10px}
  .readbtn small{font-size:17px;opacity:.85}
  .rlist{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
  .ritem{border:none;background:#fff;border-radius:20px;box-shadow:0 4px 0 #0001;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left}
  .ritem .ri{font-size:38px} .ritem .rt{flex:1;font-size:23px;display:flex;flex-direction:column} .ritem .rt small{font-size:15px;color:var(--soft);font-family:system-ui,sans-serif}
  .ritem .rd{font-size:24px} .ritem .rx{font-size:18px;color:var(--soft);padding:6px 10px;border-radius:12px;background:#F1F4FA} .ritem .rx.ask{background:var(--red);color:#fff}
  .tin{width:100%;max-width:640px;font-size:20px;padding:12px;border-radius:16px;border:2px solid #DCE3F2;margin-bottom:10px;font-family:system-ui,sans-serif;user-select:text;-webkit-user-select:text}
  .rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:700px}
  .rule{border:none;border-radius:18px;background:#fff;box-shadow:0 4px 0 #0001;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:6px solid var(--c);position:relative}
  .rule b{font-size:22px;color:var(--c)} .rule span{font-size:16px;color:var(--soft)} .rule em{position:absolute;top:2px;right:6px;font-style:normal;font-size:14px}
  .rule.on{background:#FFF8D6;transform:translateY(-3px)}
  .rulebox{background:#fff;border-radius:26px;box-shadow:0 5px 0 #0001;padding:18px;margin-top:16px;width:100%;max-width:700px;border-top:8px solid var(--c);text-align:center}
  .rulebox .rk{font-size:40px;color:var(--c)} .rulebox .rk span{color:var(--ink)} .rulebox .rtip{font-size:21px;color:var(--soft);margin:4px 0 12px}
  .rex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .exw{border:none;background:#F6F8FC;border-radius:18px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
  .exw .fw{font-size:34px;color:#33395A} .exw .pr{font-size:20px;color:var(--pink)}
  .ph{font-weight:bold} .ph.sil{color:#BCC3D3;font-weight:normal}
  .choice .fw .ph.sil{color:#C4CAD8}

// ---------- 프랑스어 목소리 (퀘벡 목소리 우선) ----------
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
loadVoices(); try{ speechSynthesis.onvoiceschanged = loadVoices; }catch(e){}
function frVoices(){ return voices.filter(v=>v.lang && v.lang.replace('_','-').toLowerCase().startsWith('fr')); }
function voiceScore(v){
  const n=(v.name||'').toLowerCase(); let sc=0;
  if(/natural|neural/.test(n)) sc+=50;
  if(/premium|enhanced|amélioré|향상|고품질/.test(n)) sc+=40;
  if(/online/.test(n)) sc+=25;
  if(/google/.test(n)) sc+=20;
  if(/amélie|amelie|chantal|sylvie|antoine|jean|thomas|audrey|marie/.test(n)) sc+=10;
  if(/fr-ca/i.test(v.lang.replace('_','-'))) sc+=15;
  if(/compact|espeak|eloquence|grandma|grandpa|rocko|shelley|sandy|flo|reed|jacques/.test(n)) sc-=30;
  if(!v.localService) sc+=5;
  return sc;
}
function pickVoice(){
  const list = frVoices(); if(!list.length) return null;
  return (S.vname && list.find(x=>x.name===S.vname)) || list.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}
let sayToken=0;
function utter(text, rate){
  const u = new SpeechSynthesisUtterance(text);
  u.lang='fr-CA'; const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
  u.rate=rate; return u;
}
// 천천히(slow): 기기마다 속도 설정을 무시하는 목소리가 있어서,
// 단어를 하나씩 끊어 읽고 사이에 쉬는 방식으로 확실히 느리게 읽어요.
function say(text, cb, slow, onWord){
  const my = ++sayToken;
  const done = () => { if(cb && my===sayToken) setTimeout(()=>{ if(my===sayToken) cb(); }, 400); };
  if(S.voice!=='on' || !('speechSynthesis' in window)){ done(); return; }
  try{
    speechSynthesis.cancel();
    if(!slow){
      const u=utter(text, S.rate==='slow'?0.75:0.9);
      if(cb){ let fired=false; const go=()=>{ if(!fired){fired=true; if(my===sayToken) cb();} }; u.onend=go; u.onerror=go;
        setTimeout(go, Math.max(2500, text.length*150)); }
      speechSynthesis.speak(u); return;
    }
    const words = text.split(/\s+/).filter(Boolean);
    const speakable = w => /[a-zà-ÿœ0-9]/i.test(w);
    // 한 단어만 있으면: 아주 천천히 두 번 읽어 줌
    const parts = words.filter(speakable).length<=1 ? [text, text] : words;
    let k=0;
    const next = () => {
      if(my!==sayToken) return;
      if(k>=parts.length){ if(onWord) onWord(-1); done(); return; }
      const idx=k, w=parts[k++];
      if(!speakable(w)){ next(); return; }
      if(onWord && parts!==words) onWord(-1); else if(onWord) onWord(idx);
      const u=utter(w, 0.5);
      let fired=false; const go=()=>{ if(fired) return; fired=true; setTimeout(next, parts===words?380:700); };
      u.onend=go; u.onerror=go; setTimeout(go, 1200 + w.length*260);
      speechSynthesis.speak(u);
    };
    next();
  }catch(e){ done(); }
}

let AC=null;
function tone(f, st, dur, type, vol){
  if(S.sfx!=='on') return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime+st;
    o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.22,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
const sfx = {
  pop(){ tone(660,0,.12,'triangle',.16); }, flip(){ tone(520,0,.08,'triangle',.12); },
  right(){ tone(784,0,.18); tone(1047,.12,.3); }, soft(){ tone(330,0,.25,'sine',.12); },
  fanfare(){ [523,659,784,1047].forEach((f,k)=>tone(f,k*.13,.35,'triangle',.2)); tone(1319,.55,.6,'triangle',.2); }
};

}

// 다음 복습까지 기다리는 시간이 점점 길어져요 (10분 → 1일 → 3일 → 7일 → 14일 → 30일).
// 기다리는 시간이 지나기 전에 또 맞히는 것은 연습으로만 치고 단계는 올라가지 않아요.
const GAP = [0, 10*60e3, 864e5, 3*864e5, 7*864e5, 14*864e5, 30*864e5];
const QUIZ_MODES = ['listen','read','write'];
const ST = [{n:'새 말',i:'⚪'},{n:'익히는 중',i:'🌱'},{n:'외웠어요',i:'⭐'},{n:'오래 기억해요',i:'👑'}];
function modesOK(w){ return QUIZ_MODES.filter(m=>w.modes&&w.modes[m]).length; }
// 0 새 말 · 1 익히는 중 · 2 외웠어요(이틀 이상 + 두 가지 퀴즈) · 3 오래 기억해요(열흘 넘게 지나도 맞힘)
function status(id){
  const w=S.w[id]; if(!w || !(w.seen||w.ok||w.bad)) return 0;
  if(w.box>=5 && modesOK(w)>=2) return 3;
  if(w.box>=3 && modesOK(w)>=2) return 2;
  return 1;
}
function isDue(id){ const w=S.w[id]; return !!w && w.box>=1 && Date.now() >= (w.due||0); }
function grade(it, mode, first){
  const w=W(it.id), now=Date.now(); w.last=now;
  if(first){
    w.ok++; w.modes=w.modes||{}; w.modes[mode]=1;
    if(now >= (w.due||0)){ w.box=Math.min(6, w.box+1); w.due=now+GAP[w.box]; }
    removeReview(it.id);
  } else {
    w.bad++; w.box = w.box>=3 ? 1 : 0; w.due = now; addReview(it.id);
  }
  S.log.push({d:now, id:it.id, m:mode, ok:first}); if(S.log.length>3000) S.log=S.log.slice(-3000);
  save();
}
function mastery(th){
  const n=th.items.length; let m=0, long=0;
  th.items.forEach(it=>{ const s=status(it.id); if(s>=2) m++; if(s===3) long++; });
  return {m, n, long, pct:Math.round(m/n*100)};
}
const levelItems = lv => THEMES.filter(t=>t.lv===lv).flatMap(t=>t.items);
function levelPct(lv){ const it=levelItems(lv); return it.length ? Math.round(it.filter(x=>status(x.id)>=2).length/it.length*100) : 0; }
const bundleItems = (lv,b) => THEMES.filter(t=>t.lv===lv&&t.b===b).flatMap(t=>t.items);
function pctOf(items){ return items.length ? Math.round(items.filter(x=>status(x.id)>=2).length/items.length*100) : 0; }
// 묶음은 순서대로 열려요: 앞 묶음을 80% 외우면 다음 묶음이 열림 (한 번 열리면 계속 열려 있음)
function bOpen(idx){
  if(idx<=0 || S.allLv==='on') return true;
  S.unlB=S.unlB||{}; const B=BUNDLES[idx], key=B.lv+'-'+B.b;
  if(S.unlB[key]) return true;
  const P=BUNDLES[idx-1];
  if(bOpen(idx-1) && pctOf(bundleItems(P.lv,P.b))>=80){ S.unlB[key]=1; save(); return true; }
  return false;
}
const bIdx = (lv,b) => BUNDLES.findIndex(x=>x.lv===lv&&x.b===b);
const bundleOpen = (lv,b) => bOpen(bIdx(lv,b));
const themeOpen = th => bundleOpen(th.lv, th.b);

function miniPic(it){
  const p=it.pic;
  if(p.startsWith('c:')) return `<span class="dotc" style="width:18px;height:18px;background:${p.slice(2)}"></span>`;
  if(p.startsWith('n:')||p.startsWith('t:')) return `<b>${esc(p.slice(2))}</b>`;
  return p;
}

let autoTimer=null, G=null, timers=[];
function later(fn, ms){ const t=setTimeout(fn, ms); timers.push(t); return t; }
function stopAll(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
  timers.forEach(clearTimeout); timers=[]; sayToken++;
  try{ speechSynthesis.cancel(); }catch(e){}
}

// ---------- 퀴즈 ----------
function chooseItems(tid, n){
  let pool;
  if(tid==='review'){ pool = dueList(); if(!pool.length) pool=THEMES[0].items; }
  else if(tid==='dict'){ pool = dictPool(); }
  else pool = themeOf(tid).items;
  // 틀린 말 → 복습할 때가 된 말 → 덜 외운 말 순서로 먼저 나옴
  const now=Date.now();
  const scored = pool.map(it=>{ const w=W(it.id); const early = w.box>=1 && now < (w.due||0);
    return {it, s:(inReview(it.id)?-4:0) + (isDue(it.id)?-2:0) + (early?w.box+2:w.box) + Math.random()*1.6}; }).sort((a,b)=>a.s-b.s);
  const out=[]; let k=0;
  while(out.length<n){ out.push(scored[k%scored.length].it); k++; }
  return shuffle(out);
}
function startQuiz(tid, mode){
  stopAll();
  const n = tid==='review' ? Math.min(Math.max(dueList().length,3), 10) : S.nq;
  G = {tid, mode, queue: chooseItems(tid, n).map(it=>({it})), i:0, total:n, earned:0, extra:0, results:[], startStars:S.stars};
  nextQ();
}
function distractors(it, k){
  const th=themeOf(it.th);
  return shuffle(th.items.filter(x=>x.id!==it.id && x.ko!==it.ko)).slice(0,k);
}
function progressHTML(){
  let h='<div class="progress">';
  for(let k=0;k<G.queue.length;k++){ const r=G.results[k]; h+=`<span class="dot ${r===true?'done':(r===false?'miss':'')}"></span>`; }
  return h+'</div>';
}
function requeue(q){
  // 틀린 말은 두 문제 뒤에 한 번 더 나옴
  if(!q.again){ G.queue.splice(Math.min(G.i+3, G.queue.length), 0, {it:q.it, again:true}); G.extra++; }
  const p=$('.progress'); if(p) p.outerHTML = progressHTML();
}
function rightAnswer(it, mode, missed, hinted){
  if(!missed && !hinted){ grade(it, mode, true); awardStar(); G.earned++; celebrate('⭐'); buddySay(pick(PRAISE_KO),'jump'); }
  else { W(it.id).seen++; save(); buddySay(missed?'이제 알겠지? 좋아요!':'잘했어요! 다음엔 힌트 없이 해 봐요','jump'); }
  G.results[G.i] = !missed && !hinted;
  say((missed||hinted?'':pick(PRAISE_FR)+' ')+it.fr, ()=>later(()=>{ G.i++; nextQ(); }, 350));
}
function nextQ(){
  stopAll();
  if(G.i>=G.queue.length){ endGame(); return; }
  const q=G.queue[G.i], it=q.it, th=themeOf(it.th);
  const mode = G.mode;
  if(mode==='write'||mode==='dict'){ writeQ(q); return; }
  const opts = shuffle([it, ...distractors(it, S.nc-1)]);
  let h = progressHTML() + (q.again?`<div class="again-tag">🔁 다시 나온 문제예요</div>`:'');
  if(mode==='listen'){
    h += `<p class="question">잘 듣고 맞는 그림을 골라요</p>
      <div class="speak"><button id="play">🔊</button><button class="slow" id="slow">🐢</button></div>
      <div class="choices ${opts.length===3?'c3':''}">` +
      opts.map(o=>`<button class="choice" data-id="${esc(o.id)}">${picHTML(o,70)}${(th.sentence||S.ko==='on')?`<span class="ko">${esc(o.ko)}</span>`:''}</button>`).join('') + `</div>`;
  } else {
    h += `<p class="question">그림에 맞는 프랑스어를 골라요</p>
      <div class="target">${picHTML(it,110)}${(th.sentence||S.ko==='on')?`<div class="ko">${esc(it.ko)}</div>`:''}</div>
      <div class="choices text ${th.sentence?'long':(opts.length===3?'c3':'')}">` +
      opts.map(o=>`<button class="choice" data-id="${esc(o.id)}"><span class="fw">${esc(o.fr)}</span>${showPr(true)?`<span class="pr">${esc(o.pr)}</span>`:''}</button>`).join('') + `</div>`;
  }
  app.innerHTML = h;
  let locked=false, missed=false;
  if(mode==='listen'){
    const play=()=>{ const b=$('#play'); if(b){ b.classList.remove('ping'); void b.offsetWidth; b.classList.add('ping'); } say(it.fr); };
    $('#play').onclick=play; $('#slow').onclick=()=>say(it.fr,null,true);
    later(play, 350);
  }
  app.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{
    if(locked || btn.classList.contains('wrong')) return;
    const o = ITEM[btn.dataset.id];
    if(o.id===it.id){
      locked=true; btn.classList.remove('hint'); btn.classList.add('right'); sfx.right();
      rightAnswer(it, mode, missed, false);
    } else {
      btn.classList.add('wrong'); sfx.soft(); buddySay(pick(CHEER),'sad');
      if(mode==='read') say(o.fr);
      if(!missed){ missed=true; grade(it, mode, false); requeue(q); }
      const wrongs = app.querySelectorAll('.choice.wrong').length;
      if(wrongs>=2 || S.nc===3){
        const right = app.querySelector(`.choice[data-id="${CSS.escape(it.id)}"]`);
        if(right) right.classList.add('hint');
        later(()=>say(it.fr), mode==='read'?1300:200);
      } else if(mode==='listen') later(()=>say(it.fr), 300);
    }
  });
}

// ---------- ✍️ 써 보기 (글자·단어 순서 맞추기) ----------
const isL = ch => /[a-zà-ÿœæ]/i.test(ch);
function writeQ(q){
  const it=q.it, th=themeOf(it.th), dict=G.mode==='dict', sentence=dict||!!th.sentence;
  let pre='', slots=[];   // slots: {ans, fixed}
  if(sentence){
    it.fr.split(/\s+/).filter(Boolean).forEach(w=>slots.push({ans:w}));
  } else {
    const m = it.fr.match(/^((?:(?:un|une|le|la|les|des|du|de)\s+)?(?:l')?)(.*)$/i);
    pre=m[1]; [...m[2]].forEach(ch=> slots.push(isL(ch)?{ans:ch}:{fixed:ch}));
  }
  const need = slots.map((s,i)=>s.fixed==null?i:-1).filter(i=>i>=0);
  let tiles = need.map(i=>slots[i].ans);
  if(dict){ // 받아쓰기: 헷갈리게 하는 단어 2개를 섞음
    const others = shuffle(dictPool().filter(x=>x.id!==it.id).flatMap(x=>x.fr.split(/\s+/))).filter(w=>!tiles.some(t=>t.toLowerCase()===w.toLowerCase()));
    tiles = tiles.concat([...new Set(others)].slice(0,2));
  }
  if(tiles.length>1){ let t; do{ t=shuffle(tiles.slice()); }while(t.join('|')===tiles.join('|') && new Set(tiles).size>1); tiles=t; }
  const fill = {};      // 칸 번호 → 조각 번호
  const used = new Set();
  let missed=false, hinted=false, tries=0, locked=false;
  app.innerHTML = progressHTML() + (q.again?`<div class="again-tag">🔁 다시 나온 문제예요</div>`:'') +
    `<p class="question">${dict?'잘 듣고 들은 대로 단어를 놓아요':(sentence?'단어를 순서대로 놓아요':'글자를 순서대로 놓아요')}</p>
     ${dict?'':`<div class="target wt">${picHTML(it,90)}${(sentence||S.ko==='on')?`<div class="ko">${esc(it.ko)}</div>`:''}</div>`}
     <div class="speak sm"><button id="play">🔊</button><button class="slow" id="slow">🐢</button></div>
     <div class="slots ${sentence?'ws':''}" id="slots"></div>
     <div class="tiles ${sentence?'ws':''}" id="tiles"></div>
     <div class="tools"><button class="small" id="hintB">💡 힌트</button><button class="small" id="clrB">🧽 다시</button></div>`;
  const play=()=>say(it.fr);
  $('#play').onclick=play; $('#slow').onclick=()=>say(it.fr,null,true); later(play,350);
  function paint(state){
    let s = pre ? `<span class="pre">${esc(pre)}</span>` : '';
    slots.forEach((sl,i)=>{
      if(sl.fixed!=null){ s += sl.fixed===' ' ? '<span class="gap"></span>' : `<span class="fix">${esc(sl.fixed)}</span>`; return; }
      const t = fill[i];
      const cls = state && state[i] ? state[i] : '';
      s += `<button class="slot ${t!=null?'full':''} ${cls}" data-s="${i}">${t!=null?esc(tiles[t]):''}</button>`;
    });
    $('#slots').innerHTML = s;
    $('#tiles').innerHTML = tiles.map((t,k)=>`<button class="tile ${used.has(k)?'used':''}" data-t="${k}">${esc(t)}</button>`).join('');
    $('#slots').querySelectorAll('.slot').forEach(b=>b.onclick=()=>{ if(locked) return; const i=+b.dataset.s; if(fill[i]!=null){ used.delete(fill[i]); delete fill[i]; sfx.flip(); paint(); } });
    $('#tiles').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
      if(locked) return; const k=+b.dataset.t; if(used.has(k)) return;
      const i = need.find(j=>fill[j]==null); if(i==null) return;
      fill[i]=k; used.add(k); sfx.pop(); if(sentence) say(tiles[k]);
      paint(); if(need.every(j=>fill[j]!=null)) check();
    });
  }
  function check(){
    const ok = need.every(i=>tiles[fill[i]].toLowerCase()===slots[i].ans.toLowerCase());
    if(ok){
      locked=true; const st={}; need.forEach(i=>st[i]='good'); paint(st); sfx.right();
      if(dict) $('#slots').insertAdjacentHTML('afterend', `<div class="ko" style="font-size:22px;color:var(--soft)">${esc(it.ko)}</div>`);
      rightAnswer(it, 'write', missed, hinted);
      return;
    }
    tries++; sfx.soft();
    if(!missed){ missed=true; grade(it,'write',false); requeue(q); }
    const st={}; need.forEach(i=>st[i]= tiles[fill[i]].toLowerCase()===slots[i].ans.toLowerCase() ? 'good' : 'bad');
    paint(st);
    if(tries>=2){
      // 두 번 틀리면 정답을 보여 줌
      locked=true; buddySay('정답을 잘 보세요!','sad');
      later(()=>{ used.clear(); need.forEach(i=>{ const k=tiles.findIndex((t,x)=>!used.has(x) && t.toLowerCase()===slots[i].ans.toLowerCase()); fill[i]=k; used.add(k); });
        const g={}; need.forEach(i=>g[i]='good'); paint(g); say(it.fr, ()=>later(()=>{ G.results[G.i]=false; G.i++; nextQ(); }, 1200)); }, 900);
    } else {
      buddySay('빨간 칸을 눌러서 빼고 다시 해 봐요!','sad');
      later(()=>{ need.forEach(i=>{ if(st[i]==='bad'){ used.delete(fill[i]); delete fill[i]; } }); paint(); }, 900);
    }
  }
  $('#hintB').onclick=()=>{
    if(locked) return;
    const i = need.find(j=>fill[j]==null || tiles[fill[j]].toLowerCase()!==slots[j].ans.toLowerCase());
    if(i==null) return;
    if(fill[i]!=null){ used.delete(fill[i]); delete fill[i]; }
    // 맞는 조각이 다른 칸에 잘못 들어가 있으면 빼 옴
    let k = tiles.findIndex((t,x)=>!used.has(x) && t.toLowerCase()===slots[i].ans.toLowerCase());
    if(k<0){ const j=need.find(j2=>fill[j2]!=null && tiles[fill[j2]].toLowerCase()===slots[i].ans.toLowerCase() && tiles[fill[j2]].toLowerCase()!==slots[j2].ans.toLowerCase()); if(j!=null){ k=fill[j]; used.delete(k); delete fill[j]; } }
    if(k<0) return;
    fill[i]=k; used.add(k); hinted=true; sfx.pop(); paint();
    if(need.every(j=>fill[j]!=null)) check();
  };
  $('#clrB').onclick=()=>{ if(locked) return; Object.keys(fill).forEach(i=>delete fill[i]); used.clear(); paint(); };
  paint();
}

// ---------- 짝 맞추기 ----------
function memory(tid){
  stopAll();
  const th=themeOf(tid);
  const items = chooseItems(tid, 6).filter((v,i,a)=>a.findIndex(x=>x.id===v.id)===i).slice(0,6);
  const cards = shuffle(items.flatMap(it=>[{it,k:'p'},{it,k:'w'}]));
  G = {tid, mode:'memory', earned:0, total:items.length, extra:0, startStars:S.stars, results:[]};
  let h=`<h1 style="font-size:28px">🃏 짝 맞추기 · ${th.ko}</h1><p class="sub">그림과 프랑스어 말을 짝지어요</p><div class="mem">`;
  cards.forEach((c,i)=>{
    h+=`<button class="mc" data-i="${i}"><div class="in"><div class="f">?</div><div class="b">${
      c.k==='p' ? picHTML(c.it,56) + (th.sentence?`<span class="pr">${esc(c.it.ko)}</span>`:'')
                : `<span class="fw">${esc(c.it.fr)}</span>${showPr(true)?`<span class="pr">${esc(c.it.pr)}</span>`:''}`
    }</div></div></button>`;
  });
  app.innerHTML = h+`</div>`;
  let open=[], busy=false, found=0, tries=0;
  const els=[...app.querySelectorAll('.mc')];
  els.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i; const c=cards[i];
    if(busy || el.classList.contains('open') || el.classList.contains('done')) return;
    el.classList.add('open'); sfx.flip();
    if(c.k==='w') say(c.it.fr);
    open.push(i);
    if(open.length===2){
      busy=true; tries++;
      const [a,b]=open; open=[];
      if(cards[a].it.id===cards[b].it.id){
        later(()=>{
          els[a].classList.add('done'); els[b].classList.add('done'); sfx.right(); found++;
          const w=W(cards[a].it.id); w.seen++; save();
          awardStar(); G.earned++; buddySay(pick(PRAISE_KO),'jump');
          say(cards[a].it.fr, null);
          busy=false;
          if(found===items.length) later(endGame, 1500);
        }, 450);
      } else {
        later(()=>{ els[a].classList.remove('open'); els[b].classList.remove('open'); sfx.soft(); busy=false; }, 1300);
      }
    }
  });
  later(()=>buddySay('카드를 두 장씩 뒤집어 봐요!'),400);
}

const R = Object.fromEntries(['ou','oi','au','ai','e1','e2','eu','u','an','on','in','ch','gn','ill','qu','soft','h','fin','fine'].map((n,i)=>[n,i]));
const VOW = 'aeiouyéèêëàâîïôûùœ';
// 단어 안의 소리 규칙을 찾아서 색칠
function markWord(word, only){
  const w = word.toLowerCase(), L = w.length; let out='', i=0;
  const isV = ch => ch && VOW.includes(ch);
  const nasalOK = j => { const nx=w[j]; return !nx || (!isV(nx) && nx!=='n' && nx!=='m' && /[a-zà-ÿœ]/.test(nx)) || !/[a-zà-ÿœ]/.test(nx); };
  const letters = (w.match(/[a-zà-ÿœ]/g)||[]).length;
  const span = (len, r) => { const txt=esc(word.substr(i,len)); i+=len;
    if(r==null || (only!=null && r!==only)) return txt;
    const rule=RULES[r]; return rule.silent ? `<span class="ph sil">${txt}</span>` : `<span class="ph" style="color:${rule.c}">${txt}</span>`; };
  const lastLetter = j => !/[a-zà-ÿœ]/.test(w[j+1]||'');
  while(i<L){
    const s3=w.substr(i,3), s2=w.substr(i,2), ch=w[i];
    if(!/[a-zà-ÿœ]/.test(ch)){ out+=span(1,null); continue; }
    const start = i===0 || !/[a-zà-ÿœ]/.test(w[i-1]);
    if(ch==='h' && start){ out+=span(1,R.h); continue; }
    if(s3==='eau'){ out+=span(3,R.au); continue; }
    if(s3==='ill' && i>0){ out+=span(3,R.ill); continue; }
    if((s3==='ain'||s3==='ein'||s3==='aim') && nasalOK(i+3)){ out+=span(3,R.in); continue; }
    if(s2==='ou'){ out+=span(2,R.ou); continue; }
    if(s2==='oi'){ out+=span(2,R.oi); continue; }
    if(s2==='au'){ out+=span(2,R.au); continue; }
    if(s2==='ai'||s2==='ei'){ out+=span(2,R.ai); continue; }
    if(s2==='œu' || s2==='eu'){ out+=span(2,R.eu); continue; }
    if(s2==='en' && w[i-1]==='i' && nasalOK(i+2)){ out+=span(2,R.in); continue; }
    if((s2==='an'||s2==='am'||s2==='en'||s2==='em') && nasalOK(i+2)){ out+=span(2,R.an); continue; }
    if((s2==='on'||s2==='om') && nasalOK(i+2)){ out+=span(2,R.on); continue; }
    if((s2==='in'||s2==='im'||s2==='un'||s2==='um') && nasalOK(i+2)){ out+=span(2,R.in); continue; }
    if(s2==='ch'){ out+=span(2,R.ch); continue; }
    if(s2==='gn'){ out+=span(2,R.gn); continue; }
    if(s2==='qu'){ out+=span(2,R.qu); continue; }
    if((s2==='er'||s2==='ez') && lastLetter(i+1) && letters>2){ out+=span(2,R.e1); continue; }
    if(ch==='é'){ out+=span(1,R.e1); continue; }
    if(ch==='è'||ch==='ê'){ out+=span(1,R.e2); continue; }
    if(ch==='u'){ out+=span(1,R.u); continue; }
    if((ch==='c'||ch==='g') && /[eiyéèê]/.test(w[i+1]||'')){ out+=span(1,R.soft); continue; }
    if(s2==='es' && lastLetter(i+1) && letters>3){ out+=span(2,R.fin); continue; }
    if(lastLetter(i) && letters>1){
      if(ch==='e' && letters>2){ out+=span(1,R.fine); continue; }
      if('stdxzp'.includes(ch)){ out+=span(1,R.fin); continue; }
    }
    out+=span(1,null);
  }
  return out;
}

// 소리 퀴즈: 소리를 듣고 맞는 단어 고르기 (규칙이 다른 단어들 중에서)
function soundQuiz(){
  stopAll();
  const n=S.nq, q=[];
  const weight = i => 3 - Math.min(3, (S.ph||{})[i]||0) + Math.random()*2;
  const order = RULES.map((r,i)=>i).sort((a,b)=>weight(b)-weight(a));
  for(let k=0;k<n;k++){ const ri=order[k%order.length]; q.push({ri, ex:pick(RULES[ri].ex)}); }
  G={tid:'sound', mode:'sound', queue:shuffle(q), i:0, earned:0, extra:0, total:n, startStars:S.stars, results:[]};
  soundQ();
}
function soundQ(){
  stopAll();
  if(G.i>=G.queue.length){ endGame(); return; }
  const q=G.queue[G.i];
  const others = shuffle(RULES.map((r,i)=>i).filter(i=>i!==q.ri)).slice(0,S.nc-1).map(i=>({ri:i, ex:pick(RULES[i].ex.filter(e=>e[0]!==q.ex[0]))}));
  const opts = shuffle([q, ...others]);
  app.innerHTML = progressHTML() + (q.again?`<div class="again-tag">🔁 다시 나온 문제예요</div>`:'') +
    `<p class="question">잘 듣고 맞는 글자를 골라요</p>
     <div class="speak"><button id="play">🔊</button><button class="slow" id="slow">🐢</button></div>
     <div class="choices text ${opts.length===3?'c3':''}">${opts.map((o,k)=>`<button class="choice" data-k="${k}"><span class="fw">${markWord(o.ex[0], o.ri)}</span></button>`).join('')}</div>`;
  const play=()=>{ const b=$('#play'); b.classList.remove('ping'); void b.offsetWidth; b.classList.add('ping'); say(q.ex[0]); };
  $('#play').onclick=play; $('#slow').onclick=()=>say(q.ex[0],null,true); later(play,350);
  let locked=false, missed=false;
  app.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{
    if(locked||btn.classList.contains('wrong')) return;
    const o=opts[+btn.dataset.k];
    S.ph=S.ph||{};
    if(o===q){
      locked=true; btn.classList.remove('hint'); btn.classList.add('right'); sfx.right();
      if(!missed){ S.ph[q.ri]=(S.ph[q.ri]||0)+1; awardStar(); G.earned++; celebrate('⭐'); buddySay(pick(PRAISE_KO),'jump'); }
      G.results[G.i]=!missed; save();
      btn.insertAdjacentHTML('beforeend', `<span class="pr" style="color:#fff">${esc(q.ex[1])}</span>`);
      say((missed?'':pick(PRAISE_FR)+' ')+q.ex[0], ()=>later(()=>{ G.i++; soundQ(); },500));
    } else {
      btn.classList.add('wrong'); sfx.soft(); buddySay(`"${RULES[q.ri].k}" 소리를 잘 들어 봐요`,'sad'); say(o.ex[0], ()=>later(()=>say(q.ex[0]),300));
      if(!missed){ missed=true; S.ph[q.ri]=0; save(); if(!q.again){ G.queue.splice(Math.min(G.i+3,G.queue.length),0,{...q, again:true}); G.extra++; } $('.progress').outerHTML=progressHTML(); }
      if(app.querySelectorAll('.choice.wrong').length>=2 || S.nc===3){ app.querySelector(`.choice[data-k="${opts.indexOf(q)}"]`).classList.add('hint'); }
    }
  });
}

function listenSentence(rd, i, btn){
  const box=$('#h'+i);
  if(!SR){ box.innerHTML='이 기기(또는 이 화면)에서는 마이크로 들을 수 없어요. 🔊로 듣고 따라 읽어 보세요.'; return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  if(recog){ try{ recog.abort(); }catch(e){} recog=null; }
  const r = new SR(); recog=r;
  r.lang='fr-CA'; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
  btn.classList.add('listening'); btn.textContent='👂 듣고 있어요…'; box.textContent='';
  buddySay('천천히 또박또박 읽어 봐요!');
  const reset=()=>{ btn.classList.remove('listening'); btn.textContent='🎤 내가 읽기'; };
  r.onresult = e => {
    const alts=[...e.results[0]].map(a=>a.transcript);
    const target=rd.s[i][0];
    // 가장 많이 맞은 후보로 비교
    let best=null;
    alts.forEach(t=>{ const heard=norm(t); const res=scoreWords(target, heard); if(!best||res.score>best.score) best={...res, t}; });
    const spans=$('#s'+i).querySelectorAll('.wd');
    spans.forEach((sp,j)=>{ sp.classList.remove('got','miss'); sp.classList.add(best.words[j]?'got':'miss'); });
    const pct=Math.round(best.score*100);
    box.innerHTML = `들린 말: <i>${esc(best.t)}</i> · <b>${pct}%</b>`;
    if(pct>=80){
      sfx.right(); awardStar(); celebrate('⭐'); buddySay(pick(PRAISE_KO),'jump'); say(pick(PRAISE_FR));
      S.readDone=S.readDone||{}; if(!rd.mine){ S.readDone[rd.id]=1; } recordToday(); save();
    } else { sfx.soft(); buddySay('빨간 단어를 🔊로 듣고 다시 읽어 봐요!','sad'); }
  };
  r.onerror = e => { reset(); box.textContent = e.error==='not-allowed'||e.error==='service-not-allowed' ? '마이크를 허용해 주세요 (브라우저 설정에서 마이크 허용).' : (e.error==='no-speech' ? '소리가 안 들렸어요. 다시 해 볼까요?' : '잘 안 들렸어요. 다시 해 볼까요?'); };
  r.onend = reset;
  try{ r.start(); }catch(e){ reset(); box.textContent='마이크를 시작할 수 없어요.'; }
}
function scoreWords(target, heard){
  const pool=heard.slice(), ws=target.split(/\s+/).filter(Boolean);
  const words=ws.map(w=>{ const toks=norm(w); if(!toks.length) return true;
    return toks.every(t=>{ const k=pool.indexOf(t); if(k>=0){ pool.splice(k,1); return true; } return false; }); });
  const real=ws.filter(w=>norm(w).length).length, okN=ws.filter((w,j)=>words[j]&&norm(w).length).length;
  return {words, score: real? okN/real : 0};
}

// ---------- 스티커판 ----------
const STK=['🌟','🦄','🌈','🐰','🍓','🌻','🐻','🎀','🐳','🍭','🦋','🐥','🥐','🥖'];
function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function stickerFor(key){ let h=0; for(const c of key) h=(h*31+c.charCodeAt(0))%997; return STK[h%STK.length]; }
function recordToday(){ const k=dayKey(); const first=!S.days[k]; S.days[k]=(S.days[k]||0)+1; save(); return first; }
function streak(){ let n=0; const d=new Date(); if(!S.days[dayKey(d)]) d.setDate(d.getDate()-1); while(S.days[dayKey(d)]){ n++; d.setDate(d.getDate()-1); } return n; }
function calendar(offset){
  stopAll(); window.scrollTo(0,0);
  const now=new Date(), base=new Date(now.getFullYear(), now.getMonth()+offset, 1);
  const y=base.getFullYear(), m=base.getMonth(), daysIn=new Date(y,m+1,0).getDate();
  let cells=['일','월','화','수','목','금','토'].map(w=>`<div class="cal-h">${w}</div>`).join('');
  for(let k=0;k<base.getDay();k++) cells+='<div></div>';
  let count=0;
  for(let d=1; d<=daysIn; d++){
    const key=dayKey(new Date(y,m,d)), done=S.days[key]; if(done) count++;
    cells+=`<div class="cal-d ${done?'got':''} ${key===dayKey()?'today':''}"><span class="n">${d}</span>${done?`<span class="s">${stickerFor(key)}</span>`:''}</div>`;
  }
  app.innerHTML=`<h1>📅 스티커판</h1>
    <div class="cal-top"><button class="small" id="pm">◀</button><span>${y}년 ${m+1}월</span><button class="small" id="nm" ${offset>=0?'disabled style="opacity:.3"':''}>▶</button></div>
    <div class="cal">${cells}</div>
    <p class="question" style="margin-top:16px">이번 달 스티커 ${count}개</p><p class="question" style="margin:0">🔥 ${streak()}일 연속!</p>`;
  $('#pm').onclick=()=>calendar(offset-1);
  if(offset<0) $('#nm').onclick=()=>calendar(offset+1);
}

  h+=`<div class="rp-h">주제별</div>`;
  LEVELS.forEach(L=>{ THEMES.filter(t=>t.lv===L.n && themeOpen(t)).forEach(th=>{ const m=mastery(th);
    h+=`<div class="rp-row"><div class="rp-top"><span>${th.icon} ${th.ko}</span><span>${m.m} / ${m.n}</span></div><div class="rp-bar"><i style="width:${m.pct}%"></i></div></div>`; }); });
  const weak=all.filter(it=>(S.w[it.id]||{}).bad>0).sort((a,b)=>(S.w[b.id].bad-S.w[b.id].ok)-(S.w[a.id].bad-S.w[a.id].ok)).slice(0,12);
  h+=`<div class="rp-h">자주 틀린 말</div>`;
  h+= weak.length ? `<div class="rp-weak">${weak.map(it=>`<span>${esc(it.fr)} <small>${esc(it.ko)} · 틀림 ${S.w[it.id].bad} / 맞음 ${S.w[it.id].ok}</small></span>`).join('')}</div>` : `<p class="rp-note">아직 틀린 말이 없어요.</p>`;
  h+=`<div class="rp-h">외웠는지 어떻게 아나요?</div>
  <div class="rp-explain">
   <p>🌱 <b>익히는 중</b> — 퀴즈를 시작한 말. 같은 날 여러 번 맞혀도 여기까지만 올라가요.</p>
   <p>⭐ <b>외웠어요</b> — <b>서로 다른 날</b>에 처음부터 맞혔고(10분 뒤 → 다음 날 다시 확인), 듣고 고르기·보고 고르기·써 보기 중 <b>두 가지 이상</b>에서 맞힌 말.</p>
   <p>👑 <b>오래 기억해요</b> — 그 뒤 <b>3일, 7일이 지나서</b> 다시 물어봐도 맞힌 말. 이후 14일, 30일 뒤에도 다시 확인해요.</p>
   <p>❌ 틀리면 다시 🌱로 내려가고, 처음 화면의 "오늘 복습할 말"에 들어가요. 복습할 때가 되기 전에 맞힌 것은 연습으로만 쳐요.</p>
   <p>🎁 단어는 묶음으로 들어 있어요. 지금 묶음의 말을 80% 외우면(⭐ 이상) 다음 묶음이 열리고, 한 단계의 마지막 묶음까지 마치면 다음 단계가 열려요.</p>
  </div>`;
  app.innerHTML=h;
}

// ---------- 설정 ----------
function paintSettings(){
  loadVoices(); const list=frVoices().sort((a,b)=>voiceScore(b)-voiceScore(a)), cur=pickVoice();
  $('#vsel').innerHTML = list.length ? list.map(v=>`<option value="${esc(v.name)}" ${cur&&cur.name===v.name?'selected':''}>${esc(v.name)} (${v.lang})${voiceScore(v)>=40?' ⭐':''}</option>`).join('')
    : `<option>이 기기에 프랑스어 목소리가 없어요</option>`;
  document.querySelectorAll('.seg').forEach(seg=>{ const k=seg.dataset.key; seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', String(S[k])===b.dataset.v)); });
}
document.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const k=seg.dataset.key; S[k]=(k==='nq'||k==='nc')?+b.dataset.v:b.dataset.v; save(); paintSettings(); if(k==='rate') $('#vtest').click();
}));
let gateAns=0, gateVal='';
function openGate(){ const a=rnd(6,9), b=rnd(6,9); gateAns=a*b; gateVal=''; $('#gateEq').textContent=`${a} × ${b} = ?`; $('#gateIn').textContent=''; $('#gate').classList.add('open'); }
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('#pad').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(k==='⌫') gateVal=gateVal.slice(0,-1);
  else if(k==='OK'){
    if(+gateVal===gateAns){ $('#gate').classList.remove('open'); paintSettings(); $('#modal').classList.add('open'); return; }
    $('#gateIn').classList.add('shake'); setTimeout(()=>{ $('#gateIn').classList.remove('shake'); openGate(); },450); return;
  } else if(gateVal.length<3) gateVal+=k;
  $('#gateIn').textContent=gateVal;
});
$('#gateCancel').onclick=()=>$('#gate').classList.remove('open');
$('#setBtn').onclick=()=>{ stopAll(); openGate(); };
$('#vsel').onchange=e=>{ S.vname=e.target.value; save(); say('Bonjour, Eunseo !'); };
$('#vtest').onclick=()=>say('Bonjour, Eunseo ! Un, deux, trois. Très bien !');
$('#reportBtn').onclick=()=>{ $('#modal').classList.remove('open'); report(); };
$('#closeSet').onclick=()=>{ $('#modal').classList.remove('open'); home(); };
$('#homeBtn').onclick=home;
$('#buddy').onclick=()=>{ sfx.pop(); const m=pick(['Bonjour !','Salut, Eunseo !','Ça va ?','Très bien !']); buddySay(m,'jump'); say(m); };

updateStars(); home(); buddySay(null);
</script>
